name: Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: wrapper/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: wrapper/pnpm-lock.yaml

      - name: Install dependencies
        run: make install

      - name: Cache OpenAPI Generator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wrapper/node_modules/@openapitools/openapi-generator-cli/versions
          key: ${{ runner.os }}-openapi-generator-${{ hashFiles('wrapper/openapitools.json') }}
          restore-keys: |
            ${{ runner.os }}-openapi-generator-

      - name: Run integration tests
        run: make test-integration

  integration-tests-windows:
    name: integration-tests-windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: wrapper/package.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: wrapper/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: wrapper

      - name: Cache OpenAPI Generator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wrapper/node_modules/@openapitools/openapi-generator-cli/versions
          key: ${{ runner.os }}-openapi-generator-${{ hashFiles('wrapper/openapitools.json') }}
          restore-keys: |
            ${{ runner.os }}-openapi-generator-

      - name: Run integration tests
        run: pnpm exec jest tests/integration/api-template.integration.spec.ts --runInBand
        working-directory: wrapper
        env:
          RUN_OPENAPI_INTEGRATION: 'true'
