name: Compatibility Tests

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  generator-version-change:
    name: OpenAPI Generator version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect OpenAPI Generator version change
        id: generator-version
        uses: jfrz38/check-version-change@176c454a13e14862ec362573f26c9e9395855d0c # v1.5.0
        with:
          file-path: wrapper/openapitools.json
          file-format: raw
          compare-source: git-ref
          compare-ref: ${{ github.event.before }}
          compare-file-path: wrapper/openapitools.json
          allow-missing-compare-file: true
          version-pattern: '"generator-cli"\s*:\s*\{\s*"version"\s*:\s*"([^"]+)"'

      - name: Summarize OpenAPI Generator version
        env:
          VERSION_CHANGED: ${{ steps.generator-version.outputs.changed }}
          LOCAL_VERSION: ${{ steps.generator-version.outputs.local-version }}
          COMPARED_VERSION: ${{ steps.generator-version.outputs.compared-version }}
          COMPARE_REF: ${{ steps.generator-version.outputs.compare-ref-resolved }}
        run: |
          {
            echo '### OpenAPI Generator version'
            echo
            echo "- Changed: \`$VERSION_CHANGED\`"
            echo "- Current version: \`$LOCAL_VERSION\`"
            echo "- Previous version: \`${COMPARED_VERSION:-not present}\`"
            echo "- Compared ref: \`$COMPARE_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

  compatibility-smoke:
    name: Node ${{ matrix.node }}, Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '24'
            java: '11'
          - node: '24'
            java: '25'
          - node: '26'
            java: '25'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: wrapper/package.json

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: wrapper/pnpm-lock.yaml

      - name: Install dependencies
        run: make install

      - name: Cache OpenAPI Generator
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: wrapper/node_modules/@openapitools/openapi-generator-cli/versions
          key: ${{ runner.os }}-openapi-generator-${{ hashFiles('wrapper/openapitools.json') }}
          restore-keys: |
            ${{ runner.os }}-openapi-generator-

      - name: Run compatibility smoke test
        run: make test-compatibility
