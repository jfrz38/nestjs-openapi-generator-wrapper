name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish (for example, v1.2.3)
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-publication
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify workflow runs from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Publish must be run from main. Current ref is $GITHUB_REF" >&2
            exit 1
          fi

      - name: Check out requested release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and package version
        id: release
        working-directory: wrapper
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-tag.js --package package.json --tag "$RELEASE_TAG" --require-tag --repository ..

      - name: Verify release tag is on main
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch origin main --tags
          if ! git merge-base --is-ancestor "$RELEASE_TAG" origin/main; then
            echo "Release tag $RELEASE_TAG is not reachable from main." >&2
            exit 1
          fi

      - id: version-check
        name: Check version is not already published
        uses: jfrz38/check-version-change@176c454a13e14862ec362573f26c9e9395855d0c # v1.5.0
        with:
          file-path: wrapper/package.json
          package-name: '@jfrz38/nestjs-open-api-generator-wrapper'
          compare-source: registry
          registry: npm

      - name: Verify version can be published
        env:
          CHANGED: ${{ steps.version-check.outputs.changed }}
          IS_HIGHER: ${{ steps.version-check.outputs.is-higher }}
          LOCAL_VERSION: ${{ steps.version-check.outputs.local-version }}
          COMPARED_VERSION: ${{ steps.version-check.outputs.compared-version }}
        run: |
          if [ "$CHANGED" != "true" ]; then
            echo "Version $LOCAL_VERSION is already published to npm." >&2
            exit 1
          fi
          if [ -n "$COMPARED_VERSION" ] && [ "$IS_HIGHER" != "true" ]; then
            echo "Version $LOCAL_VERSION is not higher than published version $COMPARED_VERSION." >&2
            exit 1
          fi

      - name: Download package from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tgz' \
            --pattern '*.sha256' \
            --dir "$RUNNER_TEMP/npm-package"

      - name: Verify release package
        working-directory: ${{ runner.temp }}/npm-package
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          test "$(find . -maxdepth 1 -name '*.tgz' -type f | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.sha256' -type f | wc -l)" -eq 1
          sha256sum --check ./*.sha256
          ARCHIVE="$(find . -maxdepth 1 -name '*.tgz' -type f)"
          PACKAGE_VERSION="$(tar -xOf "$ARCHIVE" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          test "$PACKAGE_VERSION" = "$EXPECTED_VERSION"

      - name: Transfer verified package to publication job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-${{ steps.release.outputs.tag }}
          path: |
            ${{ runner.temp }}/npm-package/*.tgz
            ${{ runner.temp }}/npm-package/*.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-${{ inputs.tag }}
          path: ${{ runner.temp }}/npm-package

      - name: Setup Node for npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Reverify package checksum
        working-directory: ${{ runner.temp }}/npm-package
        run: sha256sum --check ./*.sha256

      - name: Publish verified package to npm
        working-directory: ${{ runner.temp }}/npm-package
        run: npm publish ./*.tgz --access public --provenance
