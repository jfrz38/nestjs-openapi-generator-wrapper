version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/wrapper"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    versioning-strategy: increase
    commit-message:
      prefix: "[Dependency Update]"
    groups:
      typescript-toolchain:
        patterns:
          - "typescript"
          - "@typescript/*"
          - "ts-jest"
      dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
          - "@typescript/*"
          - "ts-jest"
          - "commander"
          - "@openapitools/openapi-generator-cli"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[CI Update]"
    groups:
      dependencies:
        patterns:
          - "*"
